
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাদের বাজার — পাসওয়ার্ড ভুলে গেছেন?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="layout">

  <!-- ============ বাম ব্র্যান্ড প্যানেল ============ -->

  <div class="brand-panel">

    <div class="brand-mark">
      <span class="dot"></span>আমাদের বাজার
    </div>

    <div class="brand-copy">

      <h1>পাসওয়ার্ড <em>ভুলে</em> গেছেন?</h1>

      <p>
        চিন্তা নেই! আপনার ইমেইল দিন,
        আমরা একটি OTP পাঠিয়ে দিচ্ছি।
      </p>

    </div>

    <div class="brand-foot">

      <span>© ২০২৬ আমাদের বাজার</span>
      <span>Privacy</span>
      <span>Terms</span>

    </div>

  </div>


  <!-- ============ ডান ফর্ম প্যানেল ============ -->

  <div class="auth-panel">

    <div class="auth-card">

      <div class="form-head">

        <h2>পাসওয়ার্ড রিসেট করুন</h2>

        <p>
          যে ইমেইল দিয়ে অ্যাকাউন্ট খুলেছিলেন, সেটি দিন
        </p>

      </div>


      <form id="forgotForm" novalidate>

        <div class="field" id="forgotEmailField">

          <label for="forgotEmail">
            ইমেইল
          </label>

          <input
            type="email"
            id="forgotEmail"
            name="email"
            placeholder="you@example.com"
            required
          >

          <small class="error">
            সঠিক ইমেইল দিন
          </small>

        </div>


        <button type="submit" class="submit-btn">
          OTP পাঠান
        </button>


        <div class="status-msg" id="forgotStatus"></div>

      </form>


      <div class="switch-line">

        মনে পড়ে গেছে?

        <button type="button" id="backToLogin">
          লগইনে ফিরে যান
        </button>

      </div>

    </div>

  </div>

</div>


<script>

  // =========================
  // Login page
  // =========================

  document.getElementById('backToLogin').addEventListener('click', () => {

    window.location.href = 'index.html';

  });


  // =========================
  // Status message
  // =========================

  function setStatus(el, message, isError){

    el.textContent = message;

    el.style.color =
      isError ? '#e26a6a' : '#8fd14f';

  }


  // =========================
  // Forgot Password
  // =========================

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {

    e.preventDefault();


    const email =
      document.getElementById('forgotEmail').value.trim();

    const statusEl =
      document.getElementById('forgotStatus');

    const submitBtn =
      e.target.querySelector('.submit-btn');


    if(!email){

      setStatus(
        statusEl,
        'ইমেইল দিতে হবে',
        true
      );

      return;

    }


    submitBtn.disabled = true;

    setStatus(
      statusEl,
      'OTP পাঠানো হচ্ছে...',
      false
    );


    try{

      const res = await fetch('/forgot-password', {

        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          email
        })

      });


      const data = await res.json();


      if(data.success){

        // Email temporarily save
        sessionStorage.setItem(
          'resetEmail',
          email
        );


        setStatus(
          statusEl,
          '✅ OTP আপনার email-এ পাঠানো হয়েছে',
          false
        );


        // Reset password page
        setTimeout(() => {

          window.location.href =
            'reset-password.html';

        }, 1000);


      } else {

        setStatus(
          statusEl,
          '❌ ' + data.message,
          true
        );

      }


    } catch(err){

      console.error(
        'Forgot password error:',
        err
      );


      setStatus(
        statusEl,
        '❌ সার্ভারের সাথে সংযোগ করা যায়নি',
        true
      );


    } finally {

      submitBtn.disabled = false;

    }

  });

</script>

</body>
</html>
