
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>পাসওয়ার্ড রিসেট — আমাদের বাজার</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f2eb;
            font-family: "Manrope", "Noto Sans Bengali", sans-serif;
        }

        .card {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }

        h1 {
            margin: 0 0 8px;
            color: #1F5D50;
        }

        p {
            color: #666;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #1F5D50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .status {
            margin-top: 15px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #1F5D50;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- STEP 1 -->
    <div id="emailStep">

        <h1>পাসওয়ার্ড ভুলে গেছেন?</h1>

        <p>
            আপনার account-এর email দিন।
            আমরা সেখানে একটি OTP পাঠাবো।
        </p>

        <label for="email">ইমেইল</label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
        >

        <button id="sendOtpBtn">
            OTP পাঠান
        </button>

    </div>


    <!-- STEP 2 -->
    <div id="resetStep" class="hidden">

        <h1>পাসওয়ার্ড পরিবর্তন করুন</h1>

        <p>
            আপনার email-এ পাঠানো ৬ digit OTP দিন।
        </p>

        <label for="otp">OTP</label>

        <input
            type="text"
            id="otp"
            maxlength="6"
            placeholder="৬ digit OTP"
        >

        <label for="newPassword">নতুন পাসওয়ার্ড</label>

        <input
            type="password"
            id="newPassword"
            placeholder="কমপক্ষে ৬ character"
        >

        <label for="confirmPassword">পাসওয়ার্ড আবার লিখুন</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="পাসওয়ার্ড আবার লিখুন"
        >

        <button id="resetBtn">
            পাসওয়ার্ড পরিবর্তন করুন
        </button>

    </div>

    <div class="status" id="status"></div>

    <a class="back" href="/">
        ← Login এ ফিরে যান
    </a>

</div>


<script>

    let userEmail = "";

    const emailStep = document.getElementById("emailStep");
    const resetStep = document.getElementById("resetStep");
    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const sendOtpBtn = document.getElementById("sendOtpBtn");
    const resetBtn = document.getElementById("resetBtn");
    const status = document.getElementById("status");


    function showStatus(message, error = false) {

        status.textContent = message;
        status.style.color = error ? "#C1440E" : "#1F5D50";
    }


    // ============================
    // SEND OTP
    // ============================

    sendOtpBtn.addEventListener("click", async () => {

        const email = emailInput.value.trim();

        if (!email) {
            showStatus("Email দিন", true);
            return;
        }

        sendOtpBtn.disabled = true;
        showStatus("OTP পাঠানো হচ্ছে...");

        try {

            const res = await fetch("/forgot-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email
                })
            });

            const data = await res.json();

            if (data.success) {

                userEmail = email;

                showStatus("✅ OTP আপনার email-এ পাঠানো হয়েছে");

                emailStep.classList.add("hidden");
                resetStep.classList.remove("hidden");

            } else {

                showStatus("❌ " + data.message, true);
            }

        } catch (error) {

            console.error(error);

            showStatus(
                "❌ সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না",
                true
            );

        } finally {

            sendOtpBtn.disabled = false;
        }
    });


    // ============================
    // RESET PASSWORD
    // ============================

    resetBtn.addEventListener("click", async () => {

        const otp = otpInput.value.trim();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!otp || !newPassword || !confirmPassword) {

            showStatus(
                "সব ঘর পূরণ করুন",
                true
            );

            return;
        }

        if (otp.length !== 6) {

            showStatus(
                "৬ digit OTP দিন",
                true
            );

            return;
        }

        if (newPassword.length < 6) {

            showStatus(
                "Password কমপক্ষে ৬ character হতে হবে",
                true
            );

            return;
        }

        if (newPassword !== confirmPassword) {

            showStatus(
                "দুইটি password একই নয়",
                true
            );

            return;
        }

        resetBtn.disabled = true;

        showStatus("Password পরিবর্তন হচ্ছে...");

        try {

            const res = await fetch("/reset-password", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: userEmail,
                    otp,
                    newPassword
                })

            });

            const data = await res.json();

            if (data.success) {

                showStatus(
                    "✅ Password successfully changed!"
                );

                setTimeout(() => {

                    window.location.href = "/";

                }, 1500);

            } else {

                showStatus(
                    "❌ " + data.message,
                    true
                );
            }

        } catch (error) {

            console.error(error);

            showStatus(
                "❌ সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না",
                true
            );

        } finally {

            resetBtn.disabled = false;
        }

    });

</script>

</body>
</html>
