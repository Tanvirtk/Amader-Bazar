
<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>আমাদের বাজার — পাসওয়ার্ড পরিবর্তন করুন</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="style.css">

</head>


<body>

<div class="layout">


  <!-- ============ বাম ব্র্যান্ড প্যানেল ============ -->

  <div class="brand-panel">

    <div class="brand-mark">

      <span class="dot"></span>

      আমাদের বাজার

    </div>


    <div class="brand-copy">

      <h1>
        নতুন <em>পাসওয়ার্ড</em> সেট করুন
      </h1>

      <p>
        আপনার email-এ আসা OTP দিয়ে
        নতুন password সেট করুন।
      </p>

    </div>


    <div class="brand-foot">

      <span>© ২০২৬ আমাদের বাজার</span>

      <span>Privacy</span>

      <span>Terms</span>

    </div>

  </div>



  <!-- ============ ডান ফর্ম প্যানেল ============ -->

  <div class="auth-panel">

    <div class="auth-card">


      <div class="form-head">

        <h2>
          নতুন পাসওয়ার্ড দিন
        </h2>

        <p>
          Email-এ আসা OTP এবং নতুন password দিন
        </p>

      </div>



      <form id="resetForm" novalidate>


        <!-- OTP -->

        <div class="field">

          <label for="otp">
            OTP
          </label>

          <input
            type="text"
            id="otp"
            placeholder="৬ digit OTP"
            maxlength="6"
            inputmode="numeric"
            required
          >

          <small class="error">
            সঠিক ৬ digit OTP দিন
          </small>

        </div>



        <!-- New Password -->

        <div class="field">

          <label for="newPassword">
            নতুন পাসওয়ার্ড
          </label>

          <input
            type="password"
            id="newPassword"
            placeholder="কমপক্ষে ৬ ক্যারেক্টার"
            required
          >

          <small class="error">
            পাসওয়ার্ড কমপক্ষে ৬ ক্যারেক্টার হতে হবে
          </small>

        </div>



        <!-- Confirm Password -->

        <div class="field">

          <label for="confirmPassword">
            পাসওয়ার্ড আবার লিখুন
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="••••••••"
            required
          >

          <small class="error">
            পাসওয়ার্ড মিলছে না
          </small>

        </div>



        <button
          type="submit"
          class="submit-btn"
        >
          পাসওয়ার্ড পরিবর্তন করুন
        </button>


        <div
          class="status-msg"
          id="resetStatus">
        </div>


      </form>



      <div class="switch-line">

        <button
          type="button"
          id="backToLogin"
        >
          লগইনে ফিরে যান
        </button>

      </div>


    </div>

  </div>

</div>



<script>


  // =========================
  // Login
  // =========================

  document
    .getElementById('backToLogin')
    .addEventListener('click', () => {

      sessionStorage.removeItem('resetEmail');

      window.location.href =
        'index.html';

    });



  // =========================
  // Status
  // =========================

  function setStatus(
    el,
    message,
    isError
  ){

    el.textContent = message;

    el.style.color =
      isError ? '#e26a6a' : '#8fd14f';

  }



  // =========================
  // Get email
  // =========================

  const email =
    sessionStorage.getItem('resetEmail');


  const statusEl =
    document.getElementById('resetStatus');


  const form =
    document.getElementById('resetForm');


  const submitBtn =
    form.querySelector('.submit-btn');



  // Email না থাকলে
  if(!email){

    setStatus(
      statusEl,
      '❌ Reset session পাওয়া যায়নি। আবার Forgot Password করুন।',
      true
    );

    submitBtn.disabled = true;

  }



  // =========================
  // Submit
  // =========================

  form.addEventListener(
    'submit',
    async (e) => {

      e.preventDefault();


      const otp =
        document
          .getElementById('otp')
          .value
          .trim();


      const newPassword =
        document
          .getElementById('newPassword')
          .value;


      const confirmPassword =
        document
          .getElementById('confirmPassword')
          .value;



      // OTP validation

      if(!/^\d{6}$/.test(otp)){

        setStatus(
          statusEl,
          '❌ সঠিক ৬ digit OTP দিন',
          true
        );

        return;

      }



      // Password validation

      if(newPassword.length < 6){

        setStatus(
          statusEl,
          '❌ পাসওয়ার্ড কমপক্ষে ৬ ক্যারেক্টার হতে হবে',
          true
        );

        return;

      }



      // Confirm password

      if(newPassword !== confirmPassword){

        setStatus(
          statusEl,
          '❌ দুটো পাসওয়ার্ড মিলছে না',
          true
        );

        return;

      }



      submitBtn.disabled = true;


      setStatus(
        statusEl,
        'পাসওয়ার্ড পরিবর্তন হচ্ছে...',
        false
      );



      try{

        const res =
          await fetch(
            '/reset-password',
            {

              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({

                email: email,

                otp: otp,

                newPassword: newPassword

              })

            }
          );



        const data =
          await res.json();



        if(data.success){

          setStatus(
            statusEl,
            '✅ ' + data.message +
            ' — লগইনে নিয়ে যাচ্ছি...',
            false
          );


          form.reset();


          // Reset email remove

          sessionStorage.removeItem(
            'resetEmail'
          );


          setTimeout(() => {

            window.location.href =
              'index.html';

          }, 1500);


        } else {

          setStatus(
            statusEl,
            '❌ ' + data.message,
            true
          );

        }



      } catch(err){

        console.error(
          'Reset password error:',
          err
        );


        setStatus(
          statusEl,
          '❌ সার্ভারের সাথে সংযোগ করা যায়নি',
          true
        );


      } finally {

        submitBtn.disabled = false;

      }

    }
  );

</script>


</body>
</html>
